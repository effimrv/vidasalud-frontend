<nav class="topbar">
  <a class="brand" routerLink="">
    <span class="brand-mark">V</span>
    <span>VidaSalud</span>
  </a>
  <div class="nav-links">
    <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="appointments" routerLinkActive="active">Atenciones</a>
  </div>
  <span class="account-area">
    <ng-container *ngIf="logueada; else noLog">
      <span class="welcome">Hola, <strong>{{ nombre }}</strong></span>
      <button class="button button-quiet" (click)="logout()">Cerrar sesion</button>
    </ng-container>
    <ng-template #noLog>
      <button class="button button-light" (click)="login()">Iniciar sesion con Microsoft</button>
    </ng-template>
  </span>
</nav>

<main class="page-shell">
  <router-outlet></router-outlet>
</main>
