server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html nunca se cachea, para que cada despliegue se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # JS y CSS llevan un hash en el nombre: se pueden cachear sin riesgo.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Rutas de Angular (/appointments, /nosotros): siempre responde index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
